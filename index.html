:root{ --ink:#1a1a1a; --muted:#333333; --faint:#888888; --hair:#e7e8ea; }
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
#stage{margin:0 auto;overflow:visible}
#wrap{width:650px;transform-origin:top left;background:#fff;color:var(--ink);
  font-family:'Suisse Screen',-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:18px 14px 14px;position:relative}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:0 0 8px}
h1{font-family:'Suisse Works',Georgia,serif;font-weight:600;font-size:26px;line-height:1.12;margin:0;color:var(--ink);-webkit-text-stroke:.4px currentColor}
.logo{height:24px;width:auto;flex:0 0 auto;margin-top:3px}
.sub{font-size:16px;line-height:1.4;color:var(--muted);margin:0 0 12px;max-width:600px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin:0 0 12px;font-size:14px;color:var(--muted)}
.legend button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;line-height:1.25}
.legend .n{color:var(--faint);margin-left:2px}
.sw{width:12px;height:12px;flex:0 0 12px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.b{aspect-ratio:1/1;cursor:pointer;transition:opacity .15s;outline:none}
.b:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.dim .b:not(.on){opacity:.18}
#tip{position:absolute;z-index:5;pointer-events:none;background:#fff;border:1px solid var(--ink);padding:9px 11px;font-size:13px;line-height:1.4;color:var(--muted);min-width:170px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none}
#tip .nm{display:block;font-family:'Suisse Screen SemiBold','Suisse Screen',Arial,sans-serif;font-weight:400;font-size:15px;color:var(--ink);margin-bottom:3px}
#tip .k{font-family:'Suisse Screen SemiBold','Suisse Screen',Arial,sans-serif;font-weight:400;color:var(--ink)}
#tip hr{border:0;border-top:1px solid var(--hair);margin:5px 0}
#tip .c{display:flex;align-items:center;gap:6px}
.foot{margin-top:10px;font-size:12.5px;line-height:1.45;color:var(--faint);text-align:right}
</style>

const fmt=m=>m>=1000?"$"+parseFloat((m/1000).toFixed(2))+" billion":"$"+Math.round(m)+" million";
document.getElementById("h1").textContent="Nvidia’s Range of Investments";
document.getElementById("sub").textContent=`Nvidia’s investments have spanned the entire AI stack. Here are ${DATA.length} of its investments since 2023, grouped by company type. Hover over a block for details.`;
const grid=document.getElementById("grid"), tip=document.getElementById("tip"), wrap=document.getElementById("wrap"), legend=document.getElementById("legend");
DATA.forEach((d,i)=>{
  const b=document.createElement("div"); b.className="b"; b.dataset.cat=d.cat; b.tabIndex=0;
  b.style.background=CATS[d.cat].color; b.setAttribute("aria-label",`${d.name}, ${CATS[d.cat].label}, ${(d.deals||[d]).map(x=>fmt(x.size_m)+", "+(x.month||"date not available")).join("; ")}`);
  const show=()=>{
    tip.innerHTML=`<b class="nm">${d.name}${d.note?"*":""}</b><span class="c"><i class="sw" style="background:${CATS[d.cat].color}"></i>${CATS[d.cat].label}</span>${(d.deals||[d]).map(x=>`<b class="k">Round size:</b> ${fmt(x.size_m)}<br><b class="k">Month:</b> ${x.month||"Not available"}`).join("<hr>")}${d.note?"<hr>* "+d.note:""}`;
    tip.style.display="block";
    const w=wrap.getBoundingClientRect(), r=b.getBoundingClientRect(), k=w.width/wrap.offsetWidth;
    let x=(r.left-w.left+r.width/2)/k-tip.offsetWidth/2; x=Math.max(8,Math.min(x,wrap.offsetWidth-tip.offsetWidth-8));
    let y=(r.top-w.top)/k-tip.offsetHeight-8; if(y<0) y=(r.bottom-w.top)/k+8;
    tip.style.left=x+"px"; tip.style.top=y+"px";
  };
  b.onmouseenter=show; b.onfocus=show; b.onclick=show; b.onmouseleave=b.onblur=()=>tip.style.display="none";
  grid.appendChild(b);
});
Object.entries(CATS).forEach(([k,c])=>{

  const off=()=>{grid.classList.remove("dim");};
  el.onmouseenter=on; el.onmouseleave=off; el.onfocus=on; el.onblur=off;
  legend.appendChild(el);
});
